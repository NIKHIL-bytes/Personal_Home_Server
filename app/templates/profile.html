{% extends "base.html" %}
{% block title %}Profile — {{ app_name }}{% endblock %}
{% block content %}

<div class="page-header">
  <h1>Profile</h1>
</div>

<div class="card" style="max-width:480px;">
  <h3 class="card-title">Account</h3>
  <p class="profile-row"><span>Username</span><span>{{ user.username }}</span></p>
  <p class="profile-row"><span>Display name</span><span>{{ user.display_name }}</span></p>
  <p class="profile-row"><span>Role</span><span>{{ user.role }}</span></p>
</div>

<div class="card" style="max-width:480px; margin-top:1.5rem;">
  <h3 class="card-title">Change Password</h3>
  <form id="changePasswordForm">
    <div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
    <div class="field"><label>New password</label><input type="password" name="new_password" required minlength="8"></div>
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
</div>

{% endblock %}
{% block scripts %}
<script>
document.getElementById('changePasswordForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = new FormData(e.target);
  try {
    await api('/api/auth/change-password', {
      method: 'POST',
      body: JSON.stringify({
        current_password: form.get('current_password'),
        new_password: form.get('new_password'),
      }),
    });
    showToast('Password changed', 'success');
    e.target.reset();
  } catch (err) {
    showToast(err.message || 'Failed to change password', 'error');
  }
});
</script>
{% endblock %}
