<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — {{ app_name }}</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body class="login-body">

  <div class="login-bg" aria-hidden="true">
    <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
      <circle cx="120" cy="90" r="180" fill="url(#g1)" opacity="0.15"/>
      <circle cx="700" cy="480" r="220" fill="url(#g1)" opacity="0.12"/>
      <defs>
        <radialGradient id="g1">
          <stop offset="0%" stop-color="#2FB4C9"/>
          <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
  </div>

  <div class="login-card">
    <img src="/static/images/logo.svg" alt="" class="login-logo">
    <h1 class="login-title">{{ app_name }}</h1>
    <p class="login-subtitle">Welcome back</p>

    <form id="loginForm" class="login-form" autocomplete="on">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">👁</button>
        </div>
      </div>

      <p id="loginError" class="form-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">
        <span class="btn-label">Sign In</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </form>

    <p class="login-footnote">Private Home Server</p>
  </div>

<script src="/static/js/utils.js"></script>
<script src="/static/js/notifications.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
